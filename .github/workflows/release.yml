name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v2.0.1）；同名 tag/Release 已存在时会删除重建'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          JAR=$(find build/libs -name '*.jar' ! -name '*-base.jar' ! -name '*-instrumented.jar')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，删除 Release 和同名 tag 后重建"
            gh release delete "$TAG" --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在（无 Release），删除 tag 以便指向最新提交"
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            "$JAR"

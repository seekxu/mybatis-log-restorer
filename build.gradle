plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group = 'com.starxg'
version = '2.0.1'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        def localIdeaPath = providers.gradleProperty('localIdeaPath')
        if (localIdeaPath.isPresent()) {
            local localIdeaPath.get()
        } else {
            intellijIdea '2024.1'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '241'
            // 不设置 untilBuild，保持对未来 IDE 版本的兼容（JetBrains 官方推荐做法）
            untilBuild = provider { null }
        }

        // 变更日志独立文件维护（按版本区分），构建时自动注入 plugin.xml
        changeNotes = rootProject.file('change-notes.html').text
    }
}